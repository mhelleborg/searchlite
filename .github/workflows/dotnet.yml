name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  # Re-publish an existing release tag (e.g. after a failed NuGet push) without
  # recreating the GitHub release. Tests run again on the tag before publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, test and publish (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Discover every test project so they can be tested on parallel runners via a
  # matrix. New providers add a Tests/SearchLite.<Provider>.Tests project and are
  # picked up automatically — no workflow change needed. The shared
  # SearchLite.Conformance library is intentionally excluded (it is not a *.Tests
  # project and has no test runner).
  discover:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Find test projects
        id: find
        shell: bash
        run: |
          projects=$(find Tests -name '*.Tests.csproj' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found test projects: $projects"

          # Every shipped package (Source/<Name>) must have a matching
          # Tests/<Name>.Tests project, so a provider can never be released
          # without being exercised by this matrix.
          missing=0
          for src in Source/*/*.csproj; do
            name=$(basename "$src" .csproj)
            if [ ! -f "Tests/$name.Tests/$name.Tests.csproj" ]; then
              echo "::error::No test project for $name (expected Tests/$name.Tests/$name.Tests.csproj)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ matrix.project }}" --configuration Release --no-build --verbosity normal

  release:
    name: Pack and Publish
    # Only publish once every provider's test project has passed on this exact
    # commit (the test matrix above also runs for the release event).
    if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && success()
    needs: [discover, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for NuGet trusted publishing (GitHub OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SearchLite.sln

      - name: Build
        run: dotnet build SearchLite.sln --configuration Release --no-restore

      - name: Get version
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Pack
        run: dotnet pack SearchLite.sln /p:Version=${{ env.VERSION }} --configuration Release --no-build -o packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages/*.nupkg
          retention-days: 7

      # Trusted publishing: exchange the workflow's OIDC token for a short-lived
      # NuGet API key. NUGET_USER is the nuget.org profile name (not email) that
      # owns the trusted publishing policy for this repo/workflow.
      - name: NuGet login (trusted publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      # --skip-duplicate makes a retry safe if an earlier attempt published
      # some of the packages before failing.
      - name: Publish
        run: >-
          dotnet nuget push packages/*.nupkg
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
